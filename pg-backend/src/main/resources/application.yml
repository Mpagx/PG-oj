spring:
  application:
    name: pg-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  session:
    store-type: ${SESSION_STORE_TYPE:none}
    timeout: 2h
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/my_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3s
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLE:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 28MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8121}
  shutdown: graceful
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
wx:
  mp:
    token: ${WX_MP_TOKEN:disabled}
    aesKey: ${WX_MP_AES_KEY:}
    appId: ${WX_MP_APP_ID:disabled}
    secret: ${WX_MP_SECRET:disabled}
    config-storage:
      type: Memory
  open:
    appId: ${WX_OPEN_APP_ID:disabled}
    appSecret: ${WX_OPEN_SECRET:disabled}
cos:
  client:
    accessKey: ${COS_ACCESS_KEY:disabled}
    secretKey: ${COS_SECRET_KEY:disabled}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:disabled}
knife4j:
  enable: ${API_DOCS_ENABLED:false}
springfox:
  documentation:
    enabled: ${API_DOCS_ENABLED:false}
codesandbox:
  type: remote
  base-url: ${CODE_SANDBOX_BASE_URL:http://127.0.0.1:8090}
  connect-timeout-ms: ${CODE_SANDBOX_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${CODE_SANDBOX_READ_TIMEOUT_MS:660000}
  token: ${CODE_SANDBOX_TOKEN:}
judge:
  queue:
    core-pool-size: ${JUDGE_CORE_POOL_SIZE:2}
    max-pool-size: ${JUDGE_MAX_POOL_SIZE:4}
    capacity: ${JUDGE_QUEUE_CAPACITY:100}
    scan-interval-ms: ${JUDGE_SCAN_INTERVAL_MS:5000}
    scan-batch-size: ${JUDGE_SCAN_BATCH_SIZE:50}
    recovery-enabled: ${JUDGE_RECOVERY_ENABLED:true}
  task-timeout-ms: ${JUDGE_TASK_TIMEOUT_MS:720000}
  max-attempts: ${JUDGE_MAX_ATTEMPTS:3}
  retry-delay-ms: ${JUDGE_RETRY_DELAY_MS:3000}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082}
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
  rate-limit:
    redis: ${RATE_LIMIT_REDIS:false}
    login: ${RATE_LIMIT_LOGIN:10}
    register: ${RATE_LIMIT_REGISTER:5}
    submit: ${RATE_LIMIT_SUBMIT:20}
  email:
    enabled: ${EMAIL_ENABLED:false}
    redis: ${EMAIL_CODE_REDIS:false}
    from: ${MAIL_FROM:}
    code-secret: ${EMAIL_CODE_SECRET:development-only-change-me}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:9121}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: pg-backend
logging:
  file:
    name: ${LOG_PATH:logs}/backend.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
