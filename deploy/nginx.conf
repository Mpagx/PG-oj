# Install within nginx's http context. Replace hostname and certificate paths.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server {
    listen 80;
    server_name oj.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name oj.example.com;
    ssl_certificate /etc/letsencrypt/live/oj.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oj.example.com/privkey.pem;
    root /opt/poj/frontend;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2|png)$ {
        expires 7d;
        try_files $uri =404;
    }
    # Management metrics and documentation never cross the public proxy.
    location ~ ^/api/(actuator|doc.html|swagger|v2/api-docs|v3/api-docs) { return 404; }
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8121;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
